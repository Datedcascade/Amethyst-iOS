name: Personal Ely.by IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Initialize submodules
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git submodule update --init --recursive
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install build tools
        run: |
          brew install make cmake ldid
          brew install --cask temurin@8
      - name: Test offline identities
        run: |
          xcrun clang -fobjc-arc -framework Foundation tests/OfflineIdentityTests.m -o "$RUNNER_TEMP/offline-identity-tests"
          "$RUNNER_TEMP/offline-identity-tests"
      - name: Build iOS IPA
        run: gmake -j3 package PLATFORM=2 RELEASE=1
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-Ely-iOS
          path: artifacts/org.angelauramc.amethyst-*-ios.ipa
          if-no-files-found: error
      - name: Package TrollStore variant
        run: gmake -j3 package PLATFORM=2 RELEASE=1 TROLLSTORE_JIT_ENT=1
      - name: Upload TrollStore package
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-Ely-iOS-TrollStore
          path: artifacts/org.angelauramc.amethyst-*-ios-trollstore.tipa
          if-no-files-found: error
